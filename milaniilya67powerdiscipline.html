<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Subway Surfers Clone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }
  #gameContainer {
    position: relative;
    width: 400px;
    height: 700px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,150,255,0.3);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  #score {
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
  }
  #coins {
    color: #FFD700;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    transition: opacity 0.3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    color: #fff;
    font-size: 36px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(0,150,255,0.8);
  }
  #overlay h2 {
    color: #FFD700;
    font-size: 24px;
    margin-bottom: 20px;
  }
  #overlay p {
    color: #ccc;
    font-size: 16px;
    margin-bottom: 8px;
  }
  #overlay .btn {
    margin-top: 20px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #00b4d8, #0077b6);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    pointer-events: all;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(0,150,255,0.4);
  }
  #overlay .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 25px rgba(0,150,255,0.6);
  }
  #finalScore { color: #fff; font-size: 28px; margin: 10px 0; }
  #finalCoins { color: #FFD700; font-size: 22px; margin-bottom: 15px; }
  .controls-hint {
    color: #aaa;
    font-size: 13px;
    margin-top: 15px;
    text-align: center;
    line-height: 1.6;
  }
  #mobileControls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    z-index: 15;
    pointer-events: none;
  }
  .mBtn {
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .mBtn:active { background: rgba(255,255,255,0.35); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="700"></canvas>

  <div id="ui">
    <div id="score">🏃 0</div>
    <div id="coins">🪙 0</div>
  </div>

  <div id="overlay">
    <h1>🛹 Subway Runner</h1>
    <p>Уворачивайся от поездов!</p>
    <p>Собирай монеты!</p>
    <button class="btn" id="startBtn">▶ ИГРАТЬ</button>
    <div class="controls-hint">
      ← → или A/D — смена полосы<br>
      ↑ или W / Space — прыжок<br>
      ↓ или S — кувырок<br>
      Свайпы на мобильном
    </div>
  </div>

  <div id="mobileControls">
    <div class="mBtn" id="btnLeft">◀</div>
    <div class="mBtn" id="btnUp">▲</div>
    <div class="mBtn" id="btnDown">▼</div>
    <div class="mBtn" id="btnRight">▶</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 400, H = 700;

// --- GAME STATE ---
let game = {
  running: false,
  score: 0,
  coins: 0,
  speed: 4,
  maxSpeed: 12,
  lane: 1, // 0, 1, 2
  playerY: 0,
  playerVY: 0,
  jumping: false,
  rolling: false,
  rollTimer: 0,
  groundY: 560,
  obstacles: [],
  coinItems: [],
  particles: [],
  trackOffset: 0,
  spawnTimer: 0,
  coinSpawnTimer: 0,
  difficulty: 1,
  highScore: parseInt(localStorage.getItem('ssHighScore') || '0'),
  totalCoins: parseInt(localStorage.getItem('ssTotalCoins') || '0')
};

const LANES = [100, 200, 300];
const GRAVITY = 0.6;
const JUMP_FORCE = -13;

// --- DRAWING HELPERS ---
function drawTrack() {
  // Sky gradient
  let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0f0c29');
  skyGrad.addColorStop(0.4, '#302b63');
  skyGrad.addColorStop(0.7, '#24243e');
  skyGrad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 30; i++) {
    let sx = (i * 137 + 50) % W;
    let sy = (i * 97 + 20) % 250;
    let ss = 1 + (i % 2);
    ctx.globalAlpha = 0.3 + 0.3 * Math.sin(Date.now() * 0.002 + i);
    ctx.fillRect(sx, sy, ss, ss);
  }
  ctx.globalAlpha = 1;

  // City silhouette
  ctx.fillStyle = '#1a1a3e';
  for (let i = 0; i < 12; i++) {
    let bx = i * 35 - 5;
    let bh = 60 + (i * 47 % 80);
    ctx.fillRect(bx, 200 - bh, 30, bh);
    // Windows
    ctx.fillStyle = '#FFD700';
    for (let wy = 210 - bh; wy < 195; wy += 12) {
      for (let wx = bx + 5; wx < bx + 27; wx += 10) {
        if (Math.random() > 0.4) ctx.fillRect(wx, wy, 4, 6);
      }
    }
    ctx.fillStyle = '#1a1a3e';
  }

  // Ground / tracks
  let groundGrad = ctx.createLinearGradient(0, 300, 0, H);
  groundGrad.addColorStop(0, '#2d2d44');
  groundGrad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, 300, W, H - 300);

  // Rails
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3;
  for (let l = 0; l < 3; l++) {
    let lx = LANES[l];
    ctx.beginPath();
    ctx.moveTo(lx - 30, 300);
    ctx.lineTo(lx - 30, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lx + 30, 300);
    ctx.lineTo(lx + 30, H);
    ctx.stroke();
  }

  // Track ties (sleepers)
  game.trackOffset = (game.trackOffset + game.speed) % 40;
  ctx.fillStyle = '#3a3a55';
  for (let ty = 300 + game.trackOffset; ty < H; ty += 40) {
    for (let l = 0; l < 3; l++) {
      ctx.fillRect(LANES[l] - 35, ty, 70, 8);
    }
  }

  // Lane dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  ctx.setLineDash([15, 15]);
  for (let i = 0; i < 2; i++) {
    let dx = (LANES[i] + LANES[i+1]) / 2;
    ctx.beginPath();
    ctx.moveTo(dx, 300);
    ctx.lineTo(dx, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawPlayer() {
  let px = LANES[game.lane];
  let py = game.groundY + game.playerY;
  let pw = 40, ph = game.rolling ? 30 : 60;
  let pyOff = game.rolling ? 30 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, game.groundY + 65, 25, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  let bodyGrad = ctx.createLinearGradient(px - 20, py - ph + pyOff, px + 20, py + pyOff);
  bodyGrad.addColorStop(0, '#ff6b35');
  bodyGrad.addColorStop(1, '#d63031');
  ctx.fillStyle = bodyGrad;

  if (game.rolling) {
    // Rolling ball shape
    ctx.beginPath();
    ctx.arc(px, py + 15, 22, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px - 8, py + 10, 5, 0, Math.PI * 2);
    ctx.arc(px + 8, py + 10, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(px - 6, py + 10, 2.5, 0, Math.PI * 2);
    ctx.arc(px + 10, py + 10, 2.5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Standing/running character
    // Legs
    let legAnim = Math.sin(Date.now() * 0.015) * 8;
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(px - 12, py - 5, 10, 20 + (game.jumping ? 0 : legAnim));
    ctx.fillRect(px + 2, py - 5, 10, 20 + (game.jumping ? 0 : -legAnim));

    // Shoes
    ctx.fillStyle = '#e17055';
    ctx.fillRect(px - 14, py + 12 + (game.jumping ? 0 : legAnim), 14, 8);
    ctx.fillRect(px, py + 12 + (game.jumping ? 0 : -legAnim), 14, 8);

    // Torso
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.roundRect(px - 18, py - ph + 10 + pyOff, 36, 35, 8);
    ctx.fill();

    // Head
    ctx.fillStyle = '#ffeaa7';
    ctx.beginPath();
    ctx.arc(px, py - ph + 5 + pyOff, 16, 0, Math.PI * 2);
    ctx.fill();

    // Hair / cap
    ctx.fillStyle = '#0984e3';
    ctx.beginPath();
    ctx.arc(px, py - ph - 2 + pyOff, 17, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(px - 18, py - ph - 2 + pyOff, 36, 6);

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px - 6, py - ph + 3 + pyOff, 4, 0, Math.PI * 2);
    ctx.arc(px + 6, py - ph + 3 + pyOff, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2d3436';
    ctx.beginPath();
    ctx.arc(px - 5, py - ph + 3 + pyOff, 2, 0, Math.PI * 2);
    ctx.arc(px + 7, py - ph + 3 + pyOff, 2, 0, Math.PI * 2);
    ctx.fill();

    // Arms
    let armAnim = Math.sin(Date.now() * 0.015) * 15;
    ctx.fillStyle = '#ff6b35';
    ctx.save();
    ctx.translate(px - 18, py - ph + 18 + pyOff);
    ctx.rotate((-30 + armAnim) * Math.PI / 180);
    ctx.fillRect(-4, 0, 8, 22);
    ctx.restore();
    ctx.save();
    ctx.translate(px + 18, py - ph + 18 + pyOff);
    ctx.rotate((30 - armAnim) * Math.PI / 180);
    ctx.fillRect(-4, 0, 8, 22);
    ctx.restore();
  }
}

function drawObstacle(obs) {
  let ox = LANES[obs.lane];
  let oy = obs.y;

  if (obs.type === 'train') {
    // Train car
    let trainGrad = ctx.createLinearGradient(ox - 30, oy - 80, ox + 30, oy);
    trainGrad.addColorStop(0, '#e74c3c');
    trainGrad.addColorStop(0.5, '#c0392b');
    trainGrad.addColorStop(1, '#96281b');
    ctx.fillStyle = trainGrad;
    ctx.beginPath();
    ctx.roundRect(ox - 30, oy - 80, 60, 85, 6);
    ctx.fill();

    // Train top
    ctx.fillStyle = '#b71c1c';
    ctx.fillRect(ox - 28, oy - 85, 56, 10);

    // Windows
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(ox - 22, oy - 70, 18, 20);
    ctx.fillRect(ox + 4, oy - 70, 18, 20);

    // Window reflection
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(ox - 20, oy - 68, 6, 16);
    ctx.fillRect(ox + 6, oy - 68, 6, 16);

    // Stripe
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(ox - 30, oy - 40, 60, 5);

    // Wheels
    ctx.fillStyle = '#2d3436';
    ctx.beginPath();
    ctx.arc(ox - 20, oy + 2, 7, 0, Math.PI * 2);
    ctx.arc(ox + 20, oy + 2, 7, 0, Math.PI * 2);
    ctx.fill();

  } else if (obs.type === 'barrier') {
    // Barrier / fence
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(ox - 28, oy - 35, 56, 35);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(ox - 28, oy - 35, 56, 8);

    // Stripes
    ctx.fillStyle = '#2d3436';
    for (let s = 0; s < 4; s++) {
      ctx.fillRect(ox - 25 + s * 14, oy - 30, 7, 25);
    }

    // Warning sign
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(ox, oy - 20, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('!', ox, oy - 16);

  } else if (obs.type === 'low_barrier') {
    // Low barrier (need to jump)
    ctx.fillStyle = '#8e44ad';
    ctx.fillRect(ox - 30, oy - 20, 60, 20);
    ctx.fillStyle = '#9b59b6';
    ctx.fillRect(ox - 30, oy - 20, 60, 6);

    // Posts
    ctx.fillStyle = '#6c3483';
    ctx.fillRect(ox - 28, oy - 30, 6, 30);
    ctx.fillRect(ox + 22, oy - 30, 6, 30);
  }
}

function drawCoin(coin) {
  let cx = LANES[coin.lane];
  let cy = coin.y;
  let bob = Math.sin(Date.now() * 0.005 + coin.lane) * 5;

  // Glow
  ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
  ctx.beginPath();
  ctx.arc(cx, cy + bob, 18, 0, Math.PI * 2);
  ctx.fill();

  // Coin
  let coinGrad = ctx.createRadialGradient(cx - 3, cy + bob - 3, 2, cx, cy + bob, 14);
  coinGrad.addColorStop(0, '#FFF176');
  coinGrad.addColorStop(0.5, '#FFD700');
  coinGrad.addColorStop(1, '#FFA000');
  ctx.fillStyle = coinGrad;
  ctx.beginPath();
  ctx.arc(cx, cy + bob, 14, 0, Math.PI * 2);
  ctx.fill();

  // $ sign
  ctx.fillStyle = '#B8860B';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('$', cx, cy + bob + 5);
}

function drawParticles() {
  for (let p of game.particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    game.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 2 + Math.random() * 4,
      color
    });
  }
}

// --- GAME LOGIC ---
function spawnObstacle() {
  let lane = Math.floor(Math.random() * 3);
  let types = ['train', 'barrier', 'low_barrier'];
  let type = types[Math.floor(Math.random() * types.length)];

  // Don't spawn on top of existing obstacle in same lane
  for (let obs of game.obstacles) {
    if (obs.lane === lane && obs.y < 100) return;
  }

  game.obstacles.push({
    lane,
    type,
    y: -100,
    width: 60,
    height: type === 'train' ? 85 : type === 'barrier' ? 35 : 20
  });
}

function spawnCoin() {
  let lane = Math.floor(Math.random() * 3);
  for (let c of game.coinItems) {
    if (c.lane === lane && c.y < 80) return;
  }
  game.coinItems.push({
    lane,
    y: -30
  });
}

function checkCollisions() {
  let px = LANES[game.lane];
  let py = game.groundY + game.playerY;
  let playerH = game.rolling ? 30 : 60;
  let playerTop = py - playerH + (game.rolling ? 30 : 0);
  let playerBottom = py + (game.rolling ? 15 : 20);

  for (let obs of game.obstacles) {
    let ox = LANES[obs.lane];
    let obsTop = obs.y - obs.height;
    let obsBottom = obs.y + 5;

    if (obs.lane === game.lane) {
      let horizontalOverlap = Math.abs(px - ox) < 45;
      let verticalOverlap = playerBottom > obsTop && playerTop < obsBottom;

      if (horizontalOverlap && verticalOverlap) {
        // Check if rolling under low barrier
        if (obs.type === 'low_barrier' && game.rolling) continue;
        // Check if jumping over low barrier
        if (obs.type === 'low_barrier' && game.playerY < -30) continue;
        // Check if jumping over barrier
        if (obs.type === 'barrier' && game.playerY < -20) continue;

        gameOver();
        return;
      }
    }
  }

  // Coin collection
  for (let i = game.coinItems.length - 1; i >= 0; i--) {
    let c = game.coinItems[i];
    let cx = LANES[c.lane];
    if (c.lane === game.lane && Math.abs(py - c.y) < 40) {
      game.coins++;
      game.totalCoins++;
      spawnParticles(cx, c.y, '#FFD700', 8);
      game.coinItems.splice(i, 1);
    }
  }
}

function update() {
  if (!game.running) return;

  // Speed increase
  game.speed = Math.min(game.maxSpeed, 4 + game.score * 0.002);
  game.difficulty = 1 + game.score * 0.001;

  // Player physics
  if (game.jumping) {
    game.playerVY += GRAVITY;
    game.playerY += game.playerVY;
    if (game.playerY >= 0) {
      game.playerY = 0;
      game.playerVY = 0;
      game.jumping = false;
    }
  }

  if (game.rolling) {
    game.rollTimer--;
    if (game.rollTimer <= 0) {
      game.rolling = false;
    }
  }

  // Spawn obstacles
  game.spawnTimer++;
  let spawnRate = Math.max(40, 80 - game.difficulty * 5);
  if (game.spawnTimer > spawnRate) {
    game.spawnTimer = 0;
    spawnObstacle();
    // Sometimes spawn double
    if (Math.random() < 0.3 * game.difficulty) {
      setTimeout(() => { if (game.running) spawnObstacle(); }, 200);
    }
  }

  // Spawn coins
  game.coinSpawnTimer++;
  if (game.coinSpawnTimer > 30) {
    game.coinSpawnTimer = 0;
    if (Math.random() < 0.5) spawnCoin();
  }

  // Move obstacles
  for (let i = game.obstacles.length - 1; i >= 0; i--) {
    game.obstacles[i].y += game.speed;
    if (game.obstacles[i].y > H + 100) {
      game.obstacles.splice(i, 1);
      game.score += 10;
    }
  }

  // Move coins
  for (let i = game.coinItems.length - 1; i >= 0; i--) {
    game.coinItems[i].y += game.speed;
    if (game.coinItems[i].y > H + 50) {
      game.coinItems.splice(i, 1);
    }
  }

  // Update particles
  for (let i = game.particles.length - 1; i >= 0; i--) {
    let p = game.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) game.particles.splice(i, 1);
  }

  // Score
  game.score += Math.floor(game.speed * 0.1);

  checkCollisions();

  // Update UI
  document.getElementById('score').textContent = '🏃 ' + game.score;
  document.getElementById('coins').textContent = '🪙 ' + game.coins;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawTrack();

  // Draw coins
  for (let c of game.coinItems) drawCoin(c);

  // Draw obstacles (sorted by y for depth)
  let allObjects = [...game.obstacles].sort((a, b) => a.y - b.y);
  for (let obs of allObjects) drawObstacle(obs);

  // Draw player
  drawPlayer();

  // Draw particles
  drawParticles();

  // Speed indicator
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '12px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('Speed: ' + game.speed.toFixed(1), W - 10, H - 10);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  game.running = true;
  game.score = 0;
  game.coins = 0;
  game.speed = 4;
  game.lane = 1;
  game.playerY = 0;
  game.playerVY = 0;
  game.jumping = false;
  game.rolling = false;
  game.rollTimer = 0;
  game.obstacles = [];
  game.coinItems = [];
  game.particles = [];
  game.spawnTimer = 0;
  game.coinSpawnTimer = 0;
  game.difficulty = 1;
  document.getElementById('overlay').classList.add('hidden');
}

function gameOver() {
  game.running = false;
  spawnParticles(LANES[game.lane], game.groundY, '#e74c3c', 20);

  if (game.score > game.highScore) {
    game.highScore = game.score;
    localStorage.setItem('ssHighScore', game.highScore);
  }
  localStorage.setItem('ssTotalCoins', game.totalCoins);

  setTimeout(() => {
    let overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>💥 GAME OVER</h1>
      <div id="finalScore">Счёт: ${game.score}</div>
      <div id="finalCoins">🪙 Монеты: ${game.coins}</div>
      <p>🏆 Рекорд: ${game.highScore}</p>
      <p>💰 Всего монет: ${game.totalCoins}</p>
      <button class="btn" id="restartBtn">🔄 ЗАНОВО</button>
      <div class="controls-hint">
        ← → смена полосы | ↑ прыжок | ↓ кувырок
      </div>
    `;
    document.getElementById('restartBtn').addEventListener('click', startGame);
  }, 500);
}

// --- CONTROLS ---
document.addEventListener('keydown', (e) => {
  if (!game.running) return;

  switch(e.key) {
    case 'ArrowLeft':
    case 'a':
    case 'A':
    case 'ф':
    case 'Ф':
      if (game.lane > 0) { game.lane--; spawnParticles(LANES[game.lane], game.groundY + 40, '#00b4d8', 5); }
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
    case 'в':
    case 'В':
      if (game.lane < 2) { game.lane++; spawnParticles(LANES[game.lane], game.groundY + 40, '#00b4d8', 5); }
      break;
    case 'ArrowUp':
    case 'w':
    case 'W':
    case 'ц':
    case 'Ц':
    case ' ':
      if (!game.jumping) {
        game.jumping = true;
        game.playerVY = JUMP_FORCE;
        game.rolling = false;
        spawnParticles(LANES[game.lane], game.groundY + 50, '#fff', 6);
      }
      e.preventDefault();
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
    case 'ы':
    case 'Ы':
      if (!game.jumping) {
        game.rolling = true;
        game.rollTimer = 30;
      }
      break;
  }
});

// Mobile buttons
document.getElementById('btnLeft').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (game.running && game.lane > 0) { game.lane--; }
});
document.getElementById('btnRight').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (game.running && game.lane < 2) { game.lane++; }
});
document.getElementById('btnUp').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (game.running && !game.jumping) {
    game.jumping = true;
    game.playerVY = JUMP_FORCE;
    game.rolling = false;
  }
});
document.getElementById('btnDown').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (game.running && !game.jumping) {
    game.rolling = true;
    game.rollTimer = 30;
  }
});

// Swipe controls
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', (e) => {
  if (!game.running) return;
  let dx = e.changedTouches[0].clientX - touchStartX;
  let dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30 && game.lane < 2) game.lane++;
    else if (dx < -30 && game.lane > 0) game.lane--;
  } else {
    if (dy < -30 && !game.jumping) {
      game.jumping = true;
      game.playerVY = JUMP_FORCE;
      game.rolling = false;
    } else if (dy > 30 && !game.jumping) {
      game.rolling = true;
      game.rollTimer = 30;
    }
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);

// Polyfill roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r,r,r,r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
  };
}

// Start loop
gameLoop();
</script>
